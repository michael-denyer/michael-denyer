      <text x="32" y="83" fill="#b4c8d2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" letter-spacing=".2">Scientific Python · Genomics · Data engineering</text>
