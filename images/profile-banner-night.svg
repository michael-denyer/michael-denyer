<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img">
  <title>Michael Denyer — genomics and data engineering</title>
  <desc>A DNA helix flows into a genomic association plot beside Michael Denyer's name.</desc>
  <defs>
